<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan your Vietnam trip</title>
<style>body{font:16px system-ui;max-width:620px;margin:30px auto;padding:20px;color:#17362f}label{display:block;margin:14px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #a8bdb5;border-radius:6px}button{background:#155b48;color:white;cursor:pointer}.trap{position:absolute;left:-10000px}</style>
<h1>Plan your Vietnam trip</h1><p>Tell us about your trip. Our team will contact you with a proposal.</p>
<form id="request">
<label>Your name<input name="contact_name" required maxlength="190" autocomplete="name"></label>
<label>Email<input name="email" type="email" maxlength="190" autocomplete="email"></label>
<label>Phone / WhatsApp<input name="phone" maxlength="64" autocomplete="tel"></label>
<label>Travel date<input name="travel_date" type="date"></label>
<label>Total guests<input name="total_guests" type="number" min="1" max="10000" value="2" required></label>
<label>Paying guests<input name="paying_pax" type="number" min="1" max="10000" value="2" required></label>
<label>Complimentary guests (FOC)<input name="foc" type="number" min="0" max="10000" value="0" required></label>
<label>Destinations<input name="destination" maxlength="500"></label>
<label>Hotel preference<select name="hotel_level"><option>3*</option><option selected>4*</option><option>5*</option></select></label>
<label>Trip details<textarea name="message" maxlength="8000" rows="4"></textarea></label>
<label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
<p>Your contact details will be used to respond to this travel request.</p><button>Send request</button><p id="status" role="status"></p>
</form>
<script src="request.js"></script></html>
