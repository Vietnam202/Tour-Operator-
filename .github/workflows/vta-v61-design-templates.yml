name: VTA V6.1 Design Templates QA
on:
  pull_request:
    paths:
      - 'templates/vta-v6/**'
      - 'tests/v61-design-gallery.cjs'
      - '.github/workflows/vta-v61-design-templates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline design template security and syntax
        run: node tests/v61-design-gallery.cjs
