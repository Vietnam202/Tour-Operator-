name: RC6.2 Integrated Runtime Staging Package
on:
  pull_request:
    paths:
      - 'journeys.php'
      - 'b2c-*'
      - 'tests/b2c-*'
      - 'tests/b2b-http-fixture-seed.php'
      - 'tests/b2b-real-auth-http.cjs'
      - 'deploy/build-integrated-package.py'
      - 'docs/RC62_INTEGRATED_STAGING_RELEASE_VI.md'
      - '.github/workflows/rc62-integrated-runtime.yml'
      - 'api/**'
      - 'handover.js'
      - 'tests/vs23-native.php'
      - 'tests/vs23-ui.cjs'
      - 'tests/rc62-release-readiness-unit.php'
      - 'deploy/check-rc62-evidence.py'
      - 'tests/rc62-operator-evidence-unit.py'
      - 'api/lib/RuntimeBuildIdentity.php'
      - 'tests/rc62-runtime-build-identity-unit.php'
      - 'tests/rc62-stage-real-tls-fpm.cjs'
      - 'tests/rc62-stage-real-tls-fpm-ci.sh'
      - 'docs/RC62_STAGE_TLS_FPM_BUILD_IDENTITY_2Q_VI.md'
      - 'docs/RC62_RUNTIME_BUILD_IDENTITY_VI.md'
      - 'tests/rc62-staging-readonly-smoke.cjs'
      - 'tests/rc62-staging-readonly-smoke-unit.cjs'
      - 'api/lib/RuntimeGuard.php'
      - 'tests/rc62-isolated-host-pin-unit.php'
      - 'docs/RC62_ISOLATED_STAGING_HOST_REVIEW_VI.md'
      - 'docs/RC62_STAGING_HTTP_OPERATOR_SMOKE_VI.md'
      - 'tests/rc62-golden-path-continuity-native.php'
      - 'tests/rc62-v5-template-persistence-native.php'
      - 'tests/tour-library-saved-source-unit.php'
      - 'tests/document-saved-source-ui.cjs'
      - 'tests/rc62-v5-http-fixture-setup.php'
      - 'tests/rc62-v5-http-auth-api.cjs'
      - 'tests/rc62-clone-restore-preflight.sh'
      - 'tests/marketing-staging-schema-p12-db-test.php'
      - 'tour-proposal-studio.*'
      - 'cost-sheet.js'
      - 'document-editor.js'
      - 'vta-cost-editor.js'
      - 'vta-cost-editor.css'
      - 'tests/document-cost-ui.cjs'
      - 'tests/vta-cost-editor-ui.cjs'
      - 'tests/tour-proposal-studio.cjs'
      - 'tests/v5-template-gallery-ui.cjs'
      - 'tests/v5-parity-recovery.cjs'
      - 'tests/v5-parity-browser.cjs'
      - 'docs/RC62_E2E_WORKFLOW_ACCEPTANCE.md'
      - 'docs/RC62_OPERATOR_STAGING_EVIDENCE_HANDOFF.md'
      - '.github/workflows/unified-workspace.yml'
      - 'app.js'
      - 'smart-enhancements.*'
      - 'index.html'
      - 'preview.html'
      - 'service-worker.js'
      - 'tests/pwa-cache-upgrade.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha-pinned-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact candidate head, not GitHub merge simulation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd, dom, curl, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax / security contract before packaging
        run: |
          set -euo pipefail
          php -l api/index.php
          php -l api/bootstrap.php
          php -l api/lib/PartnerHub.php
          php -l api/lib/TourLibrary.php
          php -l api/lib/SalesHandover.php
          php -l api/lib/SmartEnhancements.php
          php -l api/bin/rc62-release-readiness.php
          php tests/rc62-release-readiness-unit.php
          php -l api/lib/RuntimeGuard.php
          php -l api/lib/RuntimeBuildIdentity.php
          php tests/rc62-runtime-build-identity-unit.php
          php -l tests/rc62-isolated-host-pin-unit.php
          php tests/rc62-isolated-host-pin-unit.php
          python3 tests/rc62-operator-evidence-unit.py
          node --check tests/rc62-staging-readonly-smoke.cjs
          node tests/rc62-staging-readonly-smoke-unit.cjs
          php tests/tour-library-saved-source-unit.php
          node --check app.js
          node --check tour-proposal-studio.js
          node --check cost-sheet.js
          node --check vta-cost-editor.js
          node --check document-editor.js
          node --check smart-enhancements.js
          node --check service-worker.js
          node tests/pwa-cache-upgrade.cjs
          npm ci --prefix tests
          node tests/vta-smart-enhancements-check.js
          node tests/vta-smart-enhancements-ui.cjs
          node tests/vta-approved-ui.cjs
          node tests/tour-proposal-studio.cjs
          node tests/document-cost-ui.cjs
          node tests/document-saved-source-ui.cjs
          node tests/vs23-ui.cjs
          node tests/vta-cost-editor-ui.cjs
          node tests/v5-template-gallery-ui.cjs
          node tests/v5-parity-recovery.cjs
      - name: Package real RC6.2 PHP/MariaDB runtime with SHA256 manifest
        run: |
          set -euo pipefail
          python3 deploy/build-integrated-package.py --output dist
          python3 deploy/build-full-install.py dist
          python3 - <<'PY'
          import glob, json, subprocess
          candidates = glob.glob('dist/vta-rc62-manifest-*.json')
          assert len(candidates) == 1
          m = json.load(open(candidates[0], encoding='utf8'))
          assert m['source_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert len(glob.glob('dist/vta-rc62-integrated-staging-*.zip')) == 1
          assert m['migration_execution'] == 'NOT_PERFORMED'
          assert 'api/runtime-build-identity.json' in m['sha256']
          import zipfile, hashlib
          with zipfile.ZipFile(glob.glob('dist/vta-rc62-integrated-staging-*.zip')[0]) as arc:
              identity=json.loads(arc.read('runtime/api/runtime-build-identity.json'))
          sources={k:v for k,v in m['sha256'].items() if k!='api/runtime-build-identity.json'}
          inventory=hashlib.sha256(json.dumps(sources,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert identity['source_commit']==m['source_commit']
          assert identity['source_inventory_sha256']==inventory
          assert identity['source_file_count']==len(sources)
          print('PASS packaged running-build identity equals the approved source inventory')
          for path in ('cost-sheet.js', 'document-editor.js', 'vta-cost-editor.js'):
              assert path in m['sha256'], f'Missing reviewed workspace asset: {path}'
          print('PASS exact SHA release manifest')
          PY
          (cd dist && sha256sum *.zip *.json > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Validate every bundled PHP source parses without executing it
        run: |
          python3 - <<'PY'
          import glob, zipfile, subprocess, tempfile, pathlib
          packages=glob.glob('dist/vta-rc62-integrated-staging-*.zip')
          assert len(packages)==1
          with tempfile.TemporaryDirectory() as temp:
            with zipfile.ZipFile(packages[0]) as arc: arc.extractall(temp)
            files=sorted(pathlib.Path(temp,'runtime').rglob('*.php'))
            assert len(files)>25, 'Missing PHP runtime'
            for file in files:
              subprocess.run(['php','-l',str(file)],check=True,stdout=subprocess.DEVNULL)
            print(f'PASS {len(files)} PHP 8.3 syntax checks')
          PY
      - name: Upload audited staging candidate (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: vta-rc62-integrated-staging-candidate
          path: |
            dist/vta-rc62-integrated-staging-*.zip
            dist/vta-rc62-manifest-*.json
            dist/VTA_RC62_FULL_INSTALL_*.zip
            dist/VTA_RC62_FULL_INSTALL_*.zip.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  disposable-full-schema-acceptance:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: vta_p12_clone_ci
          MARIADB_USER: vta
          MARIADB_PASSWORD: vta_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, zip, gd, curl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Real core + marketing MariaDB upgrade rehearsal and B2B 038 schema
        env:
          VTA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vta_p12_clone_ci;charset=utf8mb4
          VTA_TEST_USER: vta
          VTA_TEST_PASSWORD: vta_ci_pw
        run: |
          set -euo pipefail
          php tests/marketing-staging-schema-p12-db-test.php
          php tests/b2b-hybrid-schema-ci.php
      - name: Restore synthetic MariaDB fixture and run exact-SHA read-only preflight
        env:
          VTA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vta_p12_clone_ci;charset=utf8mb4
          VTA_TEST_ROOT_PASSWORD: ci_root_password
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mariadb-client
          bash tests/rc62-clone-restore-preflight.sh
      - name: Native Sales to Operations handover change-hold on disposable MariaDB
        env:
          VTA_TEST_DB_PASSWORD: ci_root_password
          VTA_TEST_DB_PORT: '3306'
          VS22_OUTPUT_DIR: ${{ runner.temp }}/vs23-ops
        run: |
          set -euo pipefail
          mkdir -p "$VS22_OUTPUT_DIR"
          php tests/vs23-native.php | tee "$VS22_OUTPUT_DIR/handover-native.log"
          php tests/lead-potential.php | tee "$VS22_OUTPUT_DIR/lead-potential-native.log"
          php tests/fresh-install-native.php | tee "$VS22_OUTPUT_DIR/fresh-install-native.log"
      - name: Domain regression, pricing and official staging safety rules
        run: |
          set -euo pipefail
          php tests/b2b-partner-hub-unit.php
          php tests/b2b-hybrid-isolation-unit.php
          php tests/rc6-group-pricing-unit.php
          php tests/rc6-group-pricing-manual-unit.php
          php tests/staging_deploy_safety.php
          php tests/rc62-release-readiness-unit.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seven fresh-install roles with real sessions and Chromium
        env:
          VTA_TEST_DB_PASSWORD: ci_root_password
          VTA_TEST_DB_PORT: '3306'
          VTA_FRESH_FIXTURE_CONFIG_POINTER: ${{ runner.temp }}/fresh-config-pointer.txt
          VTA_FRESH_HTTP_URL: http://127.0.0.1:18870
          VTA_FRESH_PASSWORD: Synthetic-Installer-Only-2026
          VTA_FRESH_SCREENSHOTS: ${{ runner.temp }}/fresh-role-browser
        run: |
          set -euo pipefail
          npm ci --prefix tests
          npm install --prefix tests --no-save --package-lock=false playwright@1.64.0
          tests/node_modules/.bin/playwright install --with-deps chromium
          php tests/fresh-install-native.php
          export VTA_CONFIG_FILE="$(cat "$VTA_FRESH_FIXTURE_CONFIG_POINTER")"
          php -S 127.0.0.1:18870 -t . > "$RUNNER_TEMP/fresh-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent http://127.0.0.1:18870/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/fresh-install-browser.cjs
