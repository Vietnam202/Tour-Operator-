name: RC6.2 Integrated Runtime Staging Package
on:
  pull_request:
    paths:
      - 'deploy/build-integrated-package.py'
      - 'docs/RC62_INTEGRATED_STAGING_RELEASE_VI.md'
      - '.github/workflows/rc62-integrated-runtime.yml'
      - 'api/**'
      - 'app.js'
      - 'smart-enhancements.*'
      - 'index.html'
      - 'preview.html'
      - 'service-worker.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha-pinned-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact candidate head, not GitHub merge simulation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd, dom, curl, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax / security contract before packaging
        run: |
          set -euo pipefail
          php -l api/index.php
          php -l api/bootstrap.php
          php -l api/lib/PartnerHub.php
          php -l api/lib/TourLibrary.php
          php -l api/lib/SmartEnhancements.php
          node --check app.js
          node --check smart-enhancements.js
          node --check service-worker.js
          npm ci --prefix tests
          node tests/vta-smart-enhancements-check.js
          node tests/vta-smart-enhancements-ui.cjs
          node tests/vta-approved-ui.cjs
      - name: Package real RC6.2 PHP/MariaDB runtime with SHA256 manifest
        run: |
          set -euo pipefail
          python3 deploy/build-integrated-package.py --output dist
          python3 - <<'PY'
          import glob, json, subprocess
          candidates = glob.glob('dist/vta-rc62-manifest-*.json')
          assert len(candidates) == 1
          m = json.load(open(candidates[0], encoding='utf8'))
          assert m['source_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert len(glob.glob('dist/vta-rc62-integrated-staging-*.zip')) == 1
          assert m['migration_execution'] == 'NOT_PERFORMED'
          print('PASS exact SHA release manifest')
          PY
          (cd dist && sha256sum *.zip *.json > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Validate every bundled PHP source parses without executing it
        run: |
          python3 - <<'PY'
          import glob, zipfile, subprocess, tempfile, pathlib
          packages=glob.glob('dist/vta-rc62-integrated-staging-*.zip')
          assert len(packages)==1
          with tempfile.TemporaryDirectory() as temp:
            with zipfile.ZipFile(packages[0]) as arc: arc.extractall(temp)
            files=sorted(pathlib.Path(temp,'runtime').rglob('*.php'))
            assert len(files)>25, 'Missing PHP runtime'
            for file in files:
              subprocess.run(['php','-l',str(file)],check=True,stdout=subprocess.DEVNULL)
            print(f'PASS {len(files)} PHP 8.3 syntax checks')
          PY
      - name: Upload audited staging candidate (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: vta-rc62-integrated-staging-candidate
          path: |
            dist/vta-rc62-integrated-staging-*.zip
            dist/vta-rc62-manifest-*.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
