name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hca_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: hca_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hca_ci -d hca_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hca_ci:ci-only-disposable-password@127.0.0.1:5432/hca_ci
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
      ADDITIONAL_STAFF_ORIGINS: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1
      BOOKING_WEBHOOK_URL: ""
      ENABLE_LEGACY_ADMIN_API_KEY: "false"
      ADMIN_API_KEY: ci-placeholder-key-that-is-longer-than-32-characters
      PAYMENT_WEBHOOK_SECRET: ci-placeholder-secret-that-is-not-used-for-real-payments
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/lockfile-bootstrap-node20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and commit Node 20 lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add Node 20 package lock" || exit 0
          git push origin HEAD:chore/lockfile-bootstrap-node20
