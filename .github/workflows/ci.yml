name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
      ADMIN_API_KEY: ci-placeholder-key-that-is-longer-than-32-characters
      PAYMENT_WEBHOOK_SECRET: ci-placeholder-secret-that-is-not-used-for-real-payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
