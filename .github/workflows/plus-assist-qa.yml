name: RC6 ChatGPT Plus Companion QA
on:
  pull_request:
    branches:
      - 'codex/Vietnam/rc6-approved-demo-ui-v1'
    paths:
      - 'vta-plus-assist.js'
      - 'vta-plus-assist.css'
      - 'document-editor.js'
      - 'marketing-studio.js'
      - 'tour-proposal-studio.js'
      - 'workspace-centers.js'
      - 'index.html'
      - 'preview.html'
      - 'service-worker.js'
      - 'tests/vta-plus-assist.cjs'
      - 'tests/vta-plus-assist-dom.cjs'
      - 'tests/vta-plus-marketing.cjs'
      - '.github/workflows/plus-assist-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing test harness
        run: npm ci --prefix tests
      - name: Syntax and integration checks
        run: |
          node --check vta-plus-assist.js
          node --check document-editor.js
          node --check tour-proposal-studio.js
          node --check workspace-centers.js
          node --check marketing-studio.js
          node tests/vta-plus-assist.cjs
          node tests/vta-plus-assist-dom.cjs
          node tests/vta-plus-marketing.cjs
      - name: RC6 existing UI regression
        run: |
          node tests/vta-approved-ui.cjs
          node tests/v5-template-gallery-ui.cjs
          node tests/marketing-studio-ui.cjs
          node tests/document-days-ui.cjs
