name: Marketing Meta Connections P9
on:
  pull_request:
    paths:
      - 'api/lib/MetaConnectionHealth.php'
      - 'api/lib/MetaReplies.php'
      - 'api/bin/meta-connection-check.php'
      - 'api/migrations/043_meta_connection_health.sql'
      - 'api/bootstrap.php'
      - 'api/index.php'
      - 'meta-connections.js'
      - 'meta-connections.css'
      - 'index.html'
      - 'marketing-studio.js'
      - 'tests/marketing-meta-connection-p9-db-test.php'
      - '.github/workflows/marketing-meta-connections-p9.yml'
  workflow_dispatch:
jobs:
  php-js-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pw
          MARIADB_DATABASE: vta_ci
          MARIADB_USER: vta
          MARIADB_PASSWORD: vta_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/lib/MetaConnectionHealth.php
          php -l api/lib/MetaReplies.php
          php -l api/bin/meta-connection-check.php
          php -l api/bootstrap.php
          php -l api/index.php
          php -l tests/marketing-meta-connection-p9-db-test.php
      - name: JavaScript syntax
        run: |
          node --check meta-connections.js
          node --check marketing-studio.js
          node --check social-inbox.js
      - name: MariaDB token health and Messenger readiness
        env:
          VTA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vta_ci;charset=utf8mb4
          VTA_TEST_USER: vta
          VTA_TEST_PASSWORD: vta_ci_pw
        run: |
          php -m | grep -i pdo_mysql
          php tests/marketing-meta-connection-p9-db-test.php
      - name: Check live API is strict operator opt-in
        run: |
          grep -q "NOOP" api/bin/meta-connection-check.php
          grep -q "STAGING_READ_ONLY" api/bin/meta-connection-check.php
          grep -q "RuntimeGuard::config" api/bin/meta-connection-check.php
