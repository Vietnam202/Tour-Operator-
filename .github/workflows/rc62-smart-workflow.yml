name: RC6.2 Smart Workflow P1 QA
on:
  pull_request:
    paths:
      - 'api/lib/SmartEnhancements.php'
      - 'api/bootstrap.php'
      - 'api/index.php'
      - 'smart-enhancements.js'
      - 'smart-enhancements.css'
      - 'index.html'
      - 'preview.html'
      - 'app.js'
      - 'service-worker.js'
      - 'tests/vta-smart-enhancements-check.js'
      - '.github/workflows/rc62-smart-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax on changed routes and bootstrap
        run: |
          php -l api/lib/SmartEnhancements.php
          php -l api/bootstrap.php
          php -l api/index.php
      - name: JavaScript syntax and P1 boundary contract
        run: |
          node --check smart-enhancements.js
          node --check app.js
          node --check service-worker.js
          node --check tests/vta-smart-enhancements-check.js
          node tests/vta-smart-enhancements-check.js
