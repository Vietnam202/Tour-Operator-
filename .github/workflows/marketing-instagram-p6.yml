name: Marketing Instagram Publishing P6
on:
  pull_request:
    paths:
      - 'api/lib/SocialPublishing.php'
      - 'api/lib/InstagramImagePoster.php'
      - 'api/lib/MetaGraphTransport.php'
      - 'api/bin/social-publisher.php'
      - 'api/bin/meta-account-check.php'
      - 'api/migrations/040_instagram_publishing.sql'
      - 'social-publishing.js'
      - 'tests/marketing-instagram-p6-db-test.php'
      - 'tests/marketing-social-publishing-db-test.php'
      - '.github/workflows/marketing-instagram-p6.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pwd
          MARIADB_DATABASE: vta_ci
          MARIADB_USER: vta
          MARIADB_PASSWORD: vta_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/lib/SocialPublishing.php
          php -l api/lib/MetaGraphTransport.php
          php -l api/lib/InstagramImagePoster.php
          php -l api/bin/social-publisher.php
          php -l api/bin/meta-account-check.php
          php -l tests/marketing-instagram-p6-db-test.php
      - name: JavaScript syntax
        run: node --check social-publishing.js
      - name: MariaDB FB regression and Instagram Graph flow mock
        env:
          VTA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vta_ci;charset=utf8mb4
          VTA_TEST_USER: vta
          VTA_TEST_PASSWORD: vta_ci_pw
        run: |
          php -m | grep -i pdo_mysql
          php tests/marketing-instagram-p6-db-test.php
      - name: Verify live dispatch is opt-in
        run: |
          grep -q "DRY/NOOP" api/bin/social-publisher.php
          grep -q "I_ACKNOWLEDGE_REAL_POSTS" api/bin/social-publisher.php
          grep -q "RuntimeGuard::config" api/bin/meta-account-check.php
