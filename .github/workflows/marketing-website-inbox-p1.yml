name: Marketing Website Inbox P1
on:
  pull_request:
    paths:
      - 'api/lib/WebsiteInbox.php'
      - 'api/migrations/024_website_unified_inbox.sql'
      - 'social-inbox.js'
      - 'social-inbox.css'
      - 'marketing-studio.js'
      - 'index.html'
      - 'tests/website-inbox-test.php'
      - 'tests/website-inbox-db-test.php'
      - '.github/workflows/marketing-website-inbox-p1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testing_root_pwd
          MARIADB_DATABASE: vta_ci
          MARIADB_USER: vta
          MARIADB_PASSWORD: vta_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/lib/WebsiteInbox.php
          php -l api/lib/WebhookCenter.php
          php -l api/bootstrap.php
          php -l api/index.php
          php -l tests/website-inbox-test.php
          php -l tests/website-inbox-db-test.php
      - name: JavaScript syntax
        run: |
          node --check social-inbox.js
          node --check marketing-studio.js
      - name: Signed website message validation
        run: php tests/website-inbox-test.php
      - name: MariaDB integration
        env:
          VTA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vta_ci;charset=utf8mb4
          VTA_TEST_USER: vta
          VTA_TEST_PASSWORD: vta_ci_pw
        run: |
          php -m | grep -i pdo_mysql
          php tests/website-inbox-db-test.php
