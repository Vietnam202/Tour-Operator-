name: Marketing UI Sync
on:
  pull_request:
    paths:
      - 'marketing-*.js'
      - 'marketing-*.css'
      - 'social-*.js'
      - 'social-*.css'
      - 'meta-connections.*'
      - 'tour-*-inbox.*'
      - 'index.html'
      - 'preview.html'
      - 'service-worker.js'
      - 'tests/**'
      - '.github/workflows/marketing-ui-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - name: Marketing JavaScript syntax
        run: |
          node --check marketing-studio.js
          node --check social-publishing.js
          node --check meta-connections.js
          node --check social-inbox.js
          node --check service-worker.js
      - name: Complete frontend regression
        run: npm test --prefix tests
      - name: Install browser test runtime
        run: |
          npm install --prefix tests --no-save --package-lock=false playwright@1.64.0
          tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop, tablet and phone layouts
        env:
          VTA_MARKETING_SCREENSHOTS: verification/RC6.2/marketing-ui
        run: node tests/marketing-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-ui-screenshots
          path: verification/RC6.2/marketing-ui
