name: Unified VTA Workspace QA
on:
  pull_request:
    paths:
      - 'b2c-*.js'
      - 'api/lib/B2C*.php'
      - 'api/migrations/044_b2c_publications.sql'
      - 'app.js'
      - 'unified-*.js'
      - 'unified-workspace.css'
      - 'document-editor.js'
      - 'tour-program-workspace.*'
      - 'tour-library*.js'
      - 'tour-proposal-studio.*'
      - 'api/lib/Tour*.php'
      - 'api/lib/FreeformDocument.php'
      - 'editor-build/**'
      - 'index.html'
      - 'preview.html'
      - 'service-worker.js'
      - 'tests/**'
      - '.github/workflows/unified-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests
      - name: Syntax, original modules and unified permission/navigation tests
        run: |
          node --check app.js
          node --check unified-workspace.js
          node --check unified-demo.js
          node --check document-editor.js
          node --check tour-program-workspace.js
          npm test --prefix tests
          node tests/b2c-ui.cjs
          node tests/pwa-cache-upgrade.cjs
          npm run test:unified --prefix tests
          node tests/tour-program-workspace.cjs
      - name: Install local test browser
        run: |
          npm install --no-save --prefix tests playwright@1.62.1
          cd tests
          npx playwright install --with-deps chromium
      - name: Desktop/mobile workspace workflows and B2C scope
        env:
          VTA_UNIFIED_SCREENSHOTS: test-results/unified
          VTA_MARKETING_SCREENSHOTS: test-results/marketing
          VTA_SMART_SCREENSHOTS: tests/test-results/smart-p1
          VTA_PROGRAM_SCREENSHOTS: tests/test-results/program
        run: |
          npm run test:unified:browser --prefix tests
          node tests/tour-program-workspace-browser.cjs
          node tests/v5-parity-browser.cjs
          node tests/b2c-browser.cjs
          node tests/marketing-ui.cjs
          node tests/vta-smart-enhancements-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-workspace-browser-evidence
          path: tests/test-results
  backend-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd, dom, pdo_sqlite
          coverage: none
      - name: B2B isolation and authoritative pricing
        env:
          FREEFORM_FIXTURE_DIR: ${{ runner.temp }}/vta-freeform
        run: |
          mkdir -p "$FREEFORM_FIXTURE_DIR"
          php -l api/lib/PartnerHub.php
          php -l api/lib/Migrations.php
          php tests/b2b-partner-hub-unit.php
          php tests/rc6-group-pricing-unit.php
          php tests/rc6-group-pricing-manual-unit.php
          php tests/b2c-unit.php
          php tests/b2c-storefront-unit.php
          php tests/tour-library.php
          php tests/tour-program-workspace-unit.php
          php tests/document-freeform-unit.php
  backend-native:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: vta-fixture-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 33317:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd, dom, curl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Native Golden Path and authenticated HTTP Tour Library acceptance
        env:
          VTA_TEST_DB_PASSWORD: vta-fixture-only
          VTA_TEST_DB_PORT: '33317'
          VS22_OUTPUT_DIR: ${{ runner.temp }}/vta-word-output
          VTA_V5_TEST_PASSWORD: vta-fixture-only-http-password
          VTA_V5_HTTP_URL: http://127.0.0.1:18869
          VTA_V5_HTTP_PORT: '18869'
        run: |
          set -euo pipefail
          mkdir -p tests/test-results/backend
          umask 077
          PRIVATE_DIR=$(mktemp -d "$RUNNER_TEMP/vta-v5-http-private.XXXXXXXX")
          export VTA_V5_HTTP_CONFIG="$PRIVATE_DIR/config.php"
          cleanup() {
            if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || :; fi
            rm -rf "$PRIVATE_DIR"
          }
          trap cleanup EXIT
          php tests/rc62-v5-http-fixture-setup.php | tee tests/test-results/backend/native-acceptance.log
          export VTA_CONFIG_FILE="$VTA_V5_HTTP_CONFIG"
          php -S 127.0.0.1:18869 -t . > "$PRIVATE_DIR/php-server.log" 2>&1 &
          SERVER_PID=$!
          ready=0
          for i in {1..25}; do
            if curl --silent --fail --max-time 2 "http://127.0.0.1:18869/api/index.php?route=health" >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then echo "Local PHP fixture server did not start"; exit 1; fi
          node tests/rc62-v5-http-auth-api.cjs | tee tests/test-results/backend/authenticated-http-acceptance.log
          node tests/tour-library-bulk50-http.cjs | tee tests/test-results/backend/bulk50-rich-docx-acceptance.log
          node tests/b2c-http-auth.cjs | tee tests/test-results/backend/b2c-http-acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-native-backend-evidence
          path: tests/test-results/backend
