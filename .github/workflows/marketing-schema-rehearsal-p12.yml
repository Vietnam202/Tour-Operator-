name: Marketing Full-schema Rehearsal P12
on:
  pull_request:
    paths:
      - 'api/lib/MarketingSchemaUpgrade.php'
      - 'api/bin/marketing-schema-p12.php'
      - 'tests/marketing-staging-schema-p12-db-test.php'
      - 'docs/RC62_MARKETING_SCHEMA_REHEARSAL_P12.md'
      - '.github/workflows/marketing-schema-rehearsal-p12.yml'
  workflow_dispatch:
jobs:
  full-schema-disposable-clone:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: vta_p12_clone_ci
          MARIADB_USER: vta
          MARIADB_PASSWORD: vta_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/lib/MarketingSchemaUpgrade.php
          php -l api/bin/marketing-schema-p12.php
          php -l tests/marketing-staging-schema-p12-db-test.php
      - name: Full repository core+Marketing MariaDB migration rehearsal
        env:
          VTA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vta_p12_clone_ci;charset=utf8mb4
          VTA_TEST_USER: vta
          VTA_TEST_PASSWORD: vta_ci_pw
        run: |
          php -m | grep -i pdo_mysql
          php tests/marketing-staging-schema-p12-db-test.php
      - name: Default CLI is source-only with no private credentials
        run: |
          php api/bin/marketing-schema-p12.php --manifest > /tmp/manifest.json
          php -r '$v=json_decode(file_get_contents("/tmp/manifest.json"),true); if(($v["db_writes"]??null)!==false||($v["mode"]??null)!=="SOURCE_ONLY")exit(1);if(count($v["versions"]??[])<35)exit(2);'
          grep -q 'DISPOSABLE_CLONE_ONLY' api/bin/marketing-schema-p12.php
          grep -q "RuntimeGuard::config" api/bin/marketing-schema-p12.php
          grep -q 'staging_approved' api/bin/marketing-schema-p12.php
